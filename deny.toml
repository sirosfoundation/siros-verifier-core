# cargo-deny policy. Every exception includes its scope and removal condition.

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "Marvin Attack on RSA private-key operations. This verifier performs no RSA private-key operation. rsa is mandatory in jose-rs/kryptering and in tunnelbana's older JOSE stack. Remove when those stacks make RSA optional or a fixed release exists." },
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5.5 remains only through tunnelbana's grindvakt -> p256 0.13 chain; this workspace's own crates use the 0.14 family. Remove when tunnelbana/grindvakt upgrades p256." },
    { id = "RUSTSEC-2026-0374", reason = "basic-toml is build-time template tooling in uniffi_bindgen, not a shipped verifier library. Remove with a uniffi upgrade." },
    { id = "RUSTSEC-2025-0141", reason = "bincode 1.x is used by uniffi_macros at compile time only. Remove with a uniffi upgrade." },
    { id = "RUSTSEC-2024-0436", reason = "paste is a proc-macro used by uniffi at compile time only. Remove with a uniffi upgrade." },
    { id = "RUSTSEC-2026-0124", reason = "Panic on overlong ciphertext buffer (chacha20poly1305). libcrux 0.0.7 rides through wmp-mls -> openmls_rust_crypto 0.5.1 -> hpke-rs 0.6.1 -> hpke-rs-libcrux 0.6.1 (its exact =0.0.7 pin); the fix line (libcrux >=0.0.10) needs openmls_rust_crypto 0.7/hpke 0.8. Exposure: the MLS group-artifact path (DoS-class panics on malformed Welcomes/commits from counterparties). Remove when wmp-mls moves to openmls_rust_crypto 0.7." },
    { id = "RUSTSEC-2026-0207", reason = "Incorrect incremental SHAKE output (sha3). libcrux 0.0.7 rides through wmp-mls -> openmls_rust_crypto 0.5.1 -> hpke-rs 0.6.1 -> hpke-rs-libcrux 0.6.1 (its exact =0.0.7 pin); the fix line (libcrux >=0.0.10) needs openmls_rust_crypto 0.7/hpke 0.8. Exposure: the MLS group-artifact path (DoS-class panics on malformed Welcomes/commits from counterparties). Remove when wmp-mls moves to openmls_rust_crypto 0.7." },
    { id = "RUSTSEC-2026-0208", reason = "Panic in AVX2 SHAKE-256 (sha3). libcrux 0.0.7 rides through wmp-mls -> openmls_rust_crypto 0.5.1 -> hpke-rs 0.6.1 -> hpke-rs-libcrux 0.6.1 (its exact =0.0.7 pin); the fix line (libcrux >=0.0.10) needs openmls_rust_crypto 0.7/hpke 0.8. Exposure: the MLS group-artifact path (DoS-class panics on malformed Welcomes/commits from counterparties). Remove when wmp-mls moves to openmls_rust_crypto 0.7." },
    { id = "RUSTSEC-2026-0209", reason = "AES-GCM AAD length limits not enforced (aesgcm). libcrux 0.0.7 rides through wmp-mls -> openmls_rust_crypto 0.5.1 -> hpke-rs 0.6.1 -> hpke-rs-libcrux 0.6.1 (its exact =0.0.7 pin); the fix line (libcrux >=0.0.10) needs openmls_rust_crypto 0.7/hpke 0.8. Exposure: the MLS group-artifact path (DoS-class panics on malformed Welcomes/commits from counterparties). Remove when wmp-mls moves to openmls_rust_crypto 0.7." },
    { id = "RUSTSEC-2026-0211", reason = "Non-constant-time AEAD tag check (aesgcm). libcrux 0.0.7 rides through wmp-mls -> openmls_rust_crypto 0.5.1 -> hpke-rs 0.6.1 -> hpke-rs-libcrux 0.6.1 (its exact =0.0.7 pin); the fix line (libcrux >=0.0.10) needs openmls_rust_crypto 0.7/hpke 0.8. Exposure: the MLS group-artifact path (DoS-class panics on malformed Welcomes/commits from counterparties). Remove when wmp-mls moves to openmls_rust_crypto 0.7." },
    { id = "RUSTSEC-2026-0212", reason = "Incorrect constant-time swap/select on aarch64 (secrets). libcrux 0.0.7 rides through wmp-mls -> openmls_rust_crypto 0.5.1 -> hpke-rs 0.6.1 -> hpke-rs-libcrux 0.6.1 (its exact =0.0.7 pin); the fix line (libcrux >=0.0.10) needs openmls_rust_crypto 0.7/hpke 0.8. Exposure: the MLS group-artifact path (DoS-class panics on malformed Welcomes/commits from counterparties). Remove when wmp-mls moves to openmls_rust_crypto 0.7." },
    { id = "RUSTSEC-2026-0330", reason = "Panic on short seed in hybrid encapsulation (kem). libcrux 0.0.7 rides through wmp-mls -> openmls_rust_crypto 0.5.1 -> hpke-rs 0.6.1 -> hpke-rs-libcrux 0.6.1 (its exact =0.0.7 pin); the fix line (libcrux >=0.0.10) needs openmls_rust_crypto 0.7/hpke 0.8. Exposure: the MLS group-artifact path (DoS-class panics on malformed Welcomes/commits from counterparties). Remove when wmp-mls moves to openmls_rust_crypto 0.7." },
    { id = "RUSTSEC-2026-0331", reason = "Panic on short hybrid keys in decoding (kem). libcrux 0.0.7 rides through wmp-mls -> openmls_rust_crypto 0.5.1 -> hpke-rs 0.6.1 -> hpke-rs-libcrux 0.6.1 (its exact =0.0.7 pin); the fix line (libcrux >=0.0.10) needs openmls_rust_crypto 0.7/hpke 0.8. Exposure: the MLS group-artifact path (DoS-class panics on malformed Welcomes/commits from counterparties). Remove when wmp-mls moves to openmls_rust_crypto 0.7." },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "BSD-2-Clause",
    "BSD-3-Clause",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0", # webpki-root-certs, used by the gateway HTTPS client
]

[bans]
multiple-versions = "warn"
wildcards = "warn"
allow-wildcard-paths = true
# Do not add an OpenSSL/native-TLS stack to the verifier.
deny = [
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "native-tls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/SUNET/tunnelbana",
    "https://github.com/sirosfoundation/tunnelbana",
    "https://github.com/sirosfoundation/siros-dc-matcher",
    "https://github.com/sirosfoundation/zk-cred-longfellow",
    "https://github.com/sirosfoundation/zk-cred-vega",
    "https://github.com/sirosfoundation/vega-prover",
    # The WMP surface's client-side library (wmp-core, wmp-mls).
    "https://github.com/sirosfoundation/siros-wallet-core",
]
