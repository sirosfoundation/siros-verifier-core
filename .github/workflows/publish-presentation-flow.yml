name: Publish presentation flow

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - run: npm test
        working-directory: tunnelbana-plugin/src/assets

      # npm exchanges this workflow's OIDC identity; no long-lived token is used.
      - run: npm publish --access public
        working-directory: tunnelbana-plugin/src/assets
