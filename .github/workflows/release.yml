name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0.24
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      SIROS_VERIFIER_TEST_MONGODB_URI: mongodb://127.0.0.1:27017
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2
        with:
          tool: cargo-audit,cargo-deny

      - name: Check that the tag matches every workspace package
        run: |
          set -euo pipefail
          expected=${GITHUB_REF_NAME#v}
          for crate in siros-verifier-core siros-verifier-zkp siros-verifier-core-ffi siros-verifier-core-tunnelbana siros-verifier-service; do
            version=$(cargo metadata --locked --no-deps --format-version 1 \
              | jq -r --arg crate "$crate" '.packages[] | select(.name == $crate) | .version')
            if [[ "$version" != "$expected" ]]; then
              echo "::error::$crate is $version, but the release tag is $GITHUB_REF_NAME"
              exit 1
            fi
          done

      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features
      - run: python3 scripts/mutate.py
      - run: scripts/audit.sh
      - run: npm test
        working-directory: tunnelbana-plugin/src/assets
      - run: npm pack --dry-run
        working-directory: tunnelbana-plugin/src/assets

  docker:
    name: Build and publish GHCR image
    needs: validate
    uses: sirosfoundation/.github/.github/workflows/docker-build-push.yml@e9052f30ef341824ced5172cbc14f0eaeb97294c # main (cosign v3 SBOM signing + container-SBOM signature, sirosfoundation/.github#39, #40)
    permissions:
      contents: read
      packages: write
      security-events: write
    with:
      image-name: sirosfoundation/siros-verifier-core
      dockerfile: ./Dockerfile

  sbom:
    name: Generate signed source and image SBOMs
    needs: docker
    uses: sirosfoundation/.github/.github/workflows/sbom.yml@e9052f30ef341824ced5172cbc14f0eaeb97294c # main (cosign v3 SBOM signing + container-SBOM signature, sirosfoundation/.github#39, #40)
    permissions:
      contents: write
      id-token: write
      security-events: write
    with:
      artifact-name: siros-verifier-core
      scan-image: ghcr.io/sirosfoundation/siros-verifier-core@${{ needs.docker.outputs.digest }}
      scan-vulnerabilities: true
      sign-sbom: true
      upload-to-release: true
      require-sbom: true

  native-android:
    name: Build and publish the native Android Reader
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      NDK_VERSION: 27.3.13750724
      KOTLIN_VERSION: 2.1.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: "ndk;${{ env.NDK_VERSION }}"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Prepare Kotlin and JNA build tools
        run: |
          set -euo pipefail
          mkdir -p target/native-tools
          curl --proto '=https' --proto-redir '=https' -fsSL "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip" -o target/native-tools/kotlin.zip
          unzip -q target/native-tools/kotlin.zip -d target/native-tools
          curl --proto '=https' --proto-redir '=https' -fsSL "https://repo1.maven.org/maven2/net/java/dev/jna/jna/5.14.0/jna-5.14.0.jar" -o target/native-tools/jna.jar
          curl --proto '=https' --proto-redir '=https' -fsSL "https://repo1.maven.org/maven2/org/jetbrains/kotlin/kotlin-stdlib/${KOTLIN_VERSION}/kotlin-stdlib-${KOTLIN_VERSION}.jar" -o target/native-tools/kotlin-stdlib.jar
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT:-$ANDROID_HOME}/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_API=28" >> "$GITHUB_ENV"
          echo "KOTLINC=$PWD/target/native-tools/kotlinc/bin/kotlinc" >> "$GITHUB_ENV"
          echo "JNA_JAR=$PWD/target/native-tools/jna.jar" >> "$GITHUB_ENV"
          echo "KOTLIN_STDLIB_JAR=$PWD/target/native-tools/kotlin-stdlib.jar" >> "$GITHUB_ENV"
      - run: ffi/scripts/android-aar.sh target/native-android
      - name: Publish the AAR to GitHub Packages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cat > /tmp/siros-maven-settings.xml <<'EOF'
          <settings><servers><server><id>github</id><username>${env.GITHUB_ACTOR}</username><password>${env.GITHUB_TOKEN}</password></server></servers></settings>
          EOF
          aar=$(ls target/native-android/siros-verifier-core-ffi-*.aar)
          pom=$(ls target/native-android/siros-verifier-core-ffi-*.pom)
          mvn -B deploy:deploy-file --settings /tmp/siros-maven-settings.xml \
            -DrepositoryId=github -Durl="https://maven.pkg.github.com/${GITHUB_REPOSITORY}" \
            -DpomFile="$pom" -Dfile="$aar" -Dpackaging=aar
      - uses: actions/upload-artifact@v7
        with:
          name: siros-verifier-core-${{ github.ref_name }}-android
          path: |
            target/native-android/*.aar
            target/native-android/*.pom
          if-no-files-found: error
      - name: Attach the Android artifacts to the release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v2
        with:
          files: |
            target/native-android/*.aar
            target/native-android/*.pom

  native-ios:
    name: Build the native iOS Reader
    needs: validate
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: ffi/scripts/ios-xcframework.sh target/native-ios
      - name: Package and checksum the XCFramework
        run: |
          set -euo pipefail
          python3 ffi/scripts/zip-directory.py target/native-ios/SirosVerifierCore.xcframework.zip target/native-ios/SirosVerifierCore.xcframework --include-root
          swift package compute-checksum target/native-ios/SirosVerifierCore.xcframework.zip \
            | tee target/native-ios/SirosVerifierCore.xcframework.zip.checksum
      - name: Check the XCFramework archive layout
        run: |
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile("target/native-ios/SirosVerifierCore.xcframework.zip") as archive:
              names = archive.namelist()
              assert "SirosVerifierCore.xcframework/Info.plist" in names, names
              assert all(name.startswith("SirosVerifierCore.xcframework/") for name in names), names
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: siros-verifier-core-${{ github.ref_name }}-ios
          path: |
            target/native-ios/SirosVerifierCore.xcframework.zip
            target/native-ios/SirosVerifierCore.xcframework.zip.checksum
            target/native-ios/swift/siros_verifier_core_ffi.swift
          if-no-files-found: error
      - name: Attach the iOS artifacts to the release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v2
        with:
          files: |
            target/native-ios/SirosVerifierCore.xcframework.zip
            target/native-ios/SirosVerifierCore.xcframework.zip.checksum
            target/native-ios/swift/siros_verifier_core_ffi.swift

  release-metadata:
    name: Attach release metadata and checksums
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # OIDC identity for release provenance, not a registry.
      attestations: write
    steps:
      - name: Write the image digest and checksum
        run: |
          set -euo pipefail
          printf 'ghcr.io/sirosfoundation/siros-verifier-core@%s\n' '${{ needs.docker.outputs.digest }}' > image-digest.txt
          sha256sum image-digest.txt > SHA256SUMS

      - name: Attest release metadata provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            image-digest.txt
            SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: siros-verifier-core-${{ github.ref_name }}-release-metadata
          path: |
            image-digest.txt
            SHA256SUMS
          if-no-files-found: error

      - name: Attach artifacts to the GitHub release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v2
        with:
          files: |
            image-digest.txt
            SHA256SUMS
