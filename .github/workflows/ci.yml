name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0.24
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      SIROS_VERIFIER_TEST_MONGODB_URI: mongodb://127.0.0.1:27017
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo test --locked --workspace --all-features

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  mutation:
    name: Mutation checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: python3 scripts/mutate.py

  supply-chain:
    name: Advisories, licenses, and sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2
        with:
          tool: cargo-audit,cargo-deny
      - run: scripts/audit.sh

  presentation-flow:
    name: Presentation flow package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: npm test
        working-directory: tunnelbana-plugin/src/assets
      - run: npm pack --dry-run
        working-directory: tunnelbana-plugin/src/assets

  fuzz:
    name: Parser fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: nightly
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: scripts/fuzz-smoke.sh
        env:
          FUZZ_RUNS: 1000

  native-ios:
    name: Build native iOS Reader
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: ffi/scripts/ios-xcframework.sh target/native-ios
      - name: Package and checksum the XCFramework
        run: |
          set -euo pipefail
          python3 ffi/scripts/zip-directory.py target/native-ios/SirosVerifierCore.xcframework.zip target/native-ios/SirosVerifierCore.xcframework
          swift package compute-checksum target/native-ios/SirosVerifierCore.xcframework.zip \
            | tee target/native-ios/SirosVerifierCore.xcframework.zip.checksum
      - name: Check the XCFramework archive layout
        run: |
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile("target/native-ios/SirosVerifierCore.xcframework.zip") as archive:
              names = archive.namelist()
              assert "SirosVerifierCore.xcframework/Info.plist" in names, names
              assert all(name.startswith("SirosVerifierCore.xcframework/") for name in names), names
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: siros-verifier-core-${{ github.sha }}-ios
          path: |
            target/native-ios/SirosVerifierCore.xcframework.zip
            target/native-ios/SirosVerifierCore.xcframework.zip.checksum
            target/native-ios/swift/siros_verifier_core_ffi.swift
          if-no-files-found: error
