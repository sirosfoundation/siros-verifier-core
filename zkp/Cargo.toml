[package]
name = "siros-verifier-zkp"
version = "0.1.3"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = true
description = "zkp_req (nym_auth) verification: handover and challenge derivation, age bounds, circuit allowlist, issuer-key trust, dispatch to a proof backend"

[dependencies]
siros-verifier-core = { path = "..", version = "0.1.2" }
siros-dc-matcher-core = { version = "0.12.0", git = "https://github.com/sirosfoundation/siros-dc-matcher.git", rev = "49946a331bd15021f5665eee21111d925cd10434" }
zk-cred-longfellow = { version = "0.1.2", git = "https://github.com/sirosfoundation/zk-cred-longfellow.git", rev = "115bfec9bb58a7e3210062ece7c5c7ab0e936ae7" }
zk-cred-vega = { version = "0.0.7", git = "https://github.com/sirosfoundation/zk-cred-vega.git", rev = "8e7be172e9010e8b47f3192f046d5f990f602790" }
base64 = "0.22"
ciborium = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
p256 = { version = "0.14", features = ["ecdsa"] }
subtle = "2"
zeroize = "1"
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
url = "2"
zstd = "0.14.3"
rcgen = { version = "0.14", optional = true }

[features]
# The model circuit and prover used by this crate's tests and by the gateway's. Not for production builds.
testutil = ["dep:rcgen", "siros-verifier-core/testutil"]

[dev-dependencies]
siros-verifier-core = { path = "..", version = "0.1.2", features = ["testutil"] }
siros-verifier-zkp = { path = ".", features = ["testutil"] }

# The native-verification soak: sustained genuine proof verification through
# the same blocking-pool and admission shape the service uses. Sources live
# with the other developer-only tools under docs/design/examples/.
[[example]]
name = "soak_native"
path = "../docs/design/examples/soak_native.rs"
