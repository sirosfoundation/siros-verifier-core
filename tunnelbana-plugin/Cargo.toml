[package]
name = "siros-verifier-core-tunnelbana"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Tunnelbana backend for the SIROS verifier core"
publish = false

[dependencies]
siros-verifier-core = { path = "..", default-features = false }
tunnelbana-core = { git = "https://github.com/SUNET/tunnelbana.git", rev = "4c0933f6118cdc025402ddd3a0fa8230ec3cde2a" }
async-trait = "0.1"
kryptering = { version = "0.7", default-features = false, features = ["rustcrypto"] }
p256 = { version = "0.14", features = ["ecdsa", "pkcs8"] }
getrandom = "0.4"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
tokio = { version = "1", features = ["rt", "macros", "sync"] }
tracing = "0.1"
url = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"], optional = true }

[features]
default = ["http"]
http = ["dep:reqwest"]

[dev-dependencies]
siros-verifier-core = { path = "..", features = ["testutil"] }
tokio = { version = "1", features = ["rt", "macros", "sync", "net", "io-util"] }
jose-rs = { version = "0.10", default-features = false }
