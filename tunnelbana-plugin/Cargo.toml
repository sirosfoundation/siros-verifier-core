[package]
name = "siros-verifier-core-tunnelbana"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Tunnelbana backend for the SIROS verifier core"
publish = true

[dependencies]
siros-verifier-core = { path = "..", version = "0.1.0", default-features = false }
siros-verifier-zkp = { path = "../zkp", version = "0.1.0" }
siros-dc-matcher-core = { version = "0.12.0", git = "https://github.com/sirosfoundation/siros-dc-matcher.git", rev = "49946a331bd15021f5665eee21111d925cd10434" }
tunnelbana-core = { version = "0.6.0", git = "https://github.com/sirosfoundation/tunnelbana.git", rev = "ed96497f1504d0dd708dc05391366716fdd56c95" }
async-trait = "0.1"
kryptering = { version = "0.7", default-features = false, features = ["rustcrypto"] }
jose-rs = { version = "0.10", default-features = false }
p256 = { version = "0.14", features = ["ecdsa", "pkcs8"] }
getrandom = "0.4"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
tokio = { version = "1", features = ["rt", "macros", "sync"] }
tracing = "0.1"
url = "2"
ipnet = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"], optional = true }

[features]
default = ["http"]
http = ["dep:reqwest"]

[dev-dependencies]
siros-verifier-core = { path = "..", features = ["testutil"] }
siros-verifier-zkp = { path = "../zkp", features = ["testutil"] }
tokio = { version = "1", features = ["rt", "macros", "sync", "net", "io-util"] }
jose-rs = { version = "0.10", default-features = false }
