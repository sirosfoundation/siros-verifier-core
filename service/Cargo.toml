[package]
name = "siros-verifier-service"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Actix/OpenID Connect gateway for the SIROS verifier core"
publish = false

[[bin]]
name = "vc-layout"
path = "src/bin/vc-layout.rs"

[dependencies]
# HTTP/1.1 only: Fly terminates TLS and the service does not need actix's
# default HTTP/2 stack (currently h2 0.3, RUSTSEC-2026-0258).
actix-web = { version = "4.15.0", default-features = false, features = ["macros"] }
anyhow = "1"
async-trait = "0.1"
form_urlencoded = "1"
url = "2"
x509-cert = "0.2"
ed25519-dalek = { version = "3", features = ["pkcs8"] }
grindvakt = "0.8.2"
jose-rs = { version = "0.10", default-features = false }
kryptering = { version = "0.7", default-features = false, features = ["rustcrypto"] }
mongodb = { version = "3.9.1", default-features = false, features = ["compat-3-0-0", "rustls-tls"] }
p256 = { version = "0.14", features = ["ecdsa", "pkcs8"] }
pem = "3"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
siros-verifier-core = { path = ".." }
# The WMP surface: the client-side library from siros-wallet-core
# (the engine-adapter-server is NOT embedded). wmp-mls pulls openmls
# 0.8 + its crypto crates.
wmp-core = { git = "https://github.com/sirosfoundation/siros-wallet-core", rev = "c533256224de5034990f9c590396ccc2f1f51cc6" }
wmp-mls = { git = "https://github.com/sirosfoundation/siros-wallet-core", rev = "c533256224de5034990f9c590396ccc2f1f51cc6" }
siros-verifier-core-tunnelbana = { path = "../tunnelbana-plugin" }
siros-verifier-zkp = { path = "../zkp" }
toml = "1.1.6"
tokio = { version = "1", features = ["time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tunnelbana-core = { git = "https://github.com/sirosfoundation/tunnelbana.git", rev = "ed96497f1504d0dd708dc05391366716fdd56c95" }
tunnelbana-plugins = { git = "https://github.com/sirosfoundation/tunnelbana.git", rev = "ed96497f1504d0dd708dc05391366716fdd56c95" }

[dev-dependencies]
futures-util = "0.3"
rcgen = "0.14"
siros-verifier-core = { path = "..", features = ["testutil"] }
tokio = { version = "1", features = ["full"] }
zstd = "0.14.3"

# The HA/overload soak driver: a dev-only wallet-and-load harness that drives
# the real running service over HTTP. Sources live with the other developer-only
# tools under docs/design/examples/, per the repo's layout rule.
[[example]]
name = "soak_driver"
path = "../docs/design/examples/soak_driver.rs"
